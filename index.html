<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno de inglés B1</title>
<meta name="description" content="Vocabulario y gramática de inglés B1 con pronunciación AFI, pronunciación a la española, traducción y audio.">
<link rel="icon" href="icons/red-apple.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Charis+SIL:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<!--APP-->
<header class="hdr" id="hdr">
  <div class="hdr-in">
    <a class="brand" href="#inicio">
      <span class="brand-mark" aria-hidden="true">B1</span>
      <span class="brand-txt">Cuaderno de inglés</span>
    </a>
    <nav class="menu" id="menu" aria-label="Menú principal">
      <a class="m-link" href="#inicio" data-nav="inicio">Inicio</a>
      <div class="m-drop">
        <button class="m-btn" type="button" aria-expanded="false" aria-controls="dd-vocabulary" data-nav="vocabulary">Vocabulario <span class="caret" aria-hidden="true"></span></button>
        <div class="m-panel" id="dd-vocabulary" hidden></div>
      </div>
      <div class="m-drop">
        <button class="m-btn" type="button" aria-expanded="false" aria-controls="dd-grammar" data-nav="grammar">Gramática <span class="caret" aria-hidden="true"></span></button>
        <div class="m-panel" id="dd-grammar" hidden></div>
      </div>
    </nav>
    <div class="hdr-search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Buscar palabra…" autocomplete="off" aria-label="Buscar en todo el vocabulario">
    </div>
    <button class="burger" id="burger" type="button" aria-expanded="false" aria-controls="menu" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<div class="notice wrap" id="notice" role="status" hidden></div>
<main id="view"></main>

<footer class="ftr">
  <div class="wrap">
    <p>Cuaderno de inglés B1 · Ilustraciones: <a href="https://github.com/microsoft/fluentui-emoji">Fluent Emoji</a> © Microsoft Corporation (MIT) y dibujos propios. El audio usa la voz inglesa de tu dispositivo.</p>
  </div>
</footer>
<div class="toast" id="toast" role="status" hidden></div>
<!--/APP-->
<script src="assets/app.js"></script>
</body>
</html>
